name: Hosted release smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-planning-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify the public Site journey
        run: pnpm test:e2e:hosted
        env:
          PLAYWRIGHT_HOSTED_URL: https://tumraigin.peeranat-0709.chatgpt.site
